  *{box-sizing:border-box}

  #bar.ok{background:var(--ok);color:#fff}#bar.warn{background:var(--warn);color:#fff}#bar.bad{background:var(--bad);color:#fff}#bar.idle{background:var(--line);color:var(--ink)}
  #bar button{border:1px solid #fff8;background:#0003;color:#fff;border-radius:8px;padding:2px 10px;min-height:32px}

  .row{display:flex;gap:8px;align-items:center}.row>*{flex:1}

  .qty span{min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
  .x{background:none;border:0;color:var(--hot);font-size:1.2rem;min-width:40px;min-height:40px}
  .sug{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--bg)}
  .note{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:.85rem;color:var(--muted)}
  .alert{border-radius:12px;padding:10px 12px;background:#a86a0022;border:1px solid var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:left}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .ex-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.ex-row:last-child{border-bottom:0}

<script>
/* ================= basics ================= */
const TZ = 7 * 3600e3, DAY_START = 5 * 3600e3;            // Thai time; a new day starts at 05:00
const pad = n => String(n).padStart(2, '0');
const ymdUTC = ms => { const d = new Date(ms); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
const todayStr = () => ymdUTC(Date.now() + TZ - DAY_START);
const parts = s => s.split('-').map(Number);
const addDays = (s, n) => { const [y, m, d] = parts(s); return ymdUTC(Date.UTC(y, m - 1, d + n)); };
const dow = s => { const [y, m, d] = parts(s); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };
const DN = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
const label = s => 'วัน' + DN[dow(s)] + ' ' + parts(s)[2] + '/' + parts(s)[1];
const nowHM = () => { const d = new Date(Date.now() + TZ); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); };
const r0 = x => Math.round(x), r1 = x => Math.round(x * 10) / 10;
const fmt = x => r0(x).toLocaleString('th-TH');
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* ใช้ในหน่วยความจำต่อ */ } };
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'value') e.value = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  kids.flat(9).forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}

/* ================= defaults (owner's plan) ================= */
const DEF_FOODS = [
  { id: 'whey', name: 'เวย์ BAAM Iso Soy', unit: 'สกู๊ป', base: 1, k: 65, p: 15, c: 0.5, f: 0.5, step: 0.5, dq: 1, est: false },
  { id: 'oats', name: 'ข้าวโอ๊ต', unit: 'ก.', base: 100, k: 400, p: 12, c: 68, f: 10, step: 10, dq: 60, est: false },
  { id: 'rice', name: 'ข้าวสวย (สุก)', unit: 'ก.', base: 100, k: 130, p: 2.7, c: 28, f: 0.3, step: 10, dq: 160, est: true },
  { id: 'chicken', name: 'อกไก่ (ดิบ)', unit: 'ก.', base: 100, k: 115, p: 23, c: 0, f: 2, step: 10, dq: 200, est: true },
  { id: 'shrimp', name: 'กุ้งปอกเปลือก (ดิบ)', unit: 'ก.', base: 100, k: 85, p: 18.5, c: 0.5, f: 1, step: 10, dq: 150, est: true },
  { id: 'egg', name: 'ไข่ไก่', unit: 'ฟอง', base: 1, k: 72, p: 6.3, c: 0.4, f: 4.8, step: 1, dq: 1, est: true },
  { id: 'duckegg', name: 'ไข่เป็ด', unit: 'ฟอง', base: 1, k: 130, p: 9.2, c: 1, f: 9.6, step: 1, dq: 1, est: true },
  { id: 'wheyrtd', name: 'เวย์พร้อมดื่ม (ร้านสะดวกซื้อ)', unit: 'ขวด', base: 1, k: 160, p: 27, c: 8, f: 3, step: 1, dq: 1, est: true },
  { id: 'meiji', name: 'นม Meiji High Protein ช็อกโกแลต', unit: 'มล.', base: 100, k: 60, p: 9.43, c: 3.71, f: 0.71, step: 50, dq: 350, est: false },
  { id: 'meijiup', name: 'นมเมจิ อัพ โปรตีน 100 ก. รสจืด', unit: 'มล.', base: 100, k: 60, p: 5, c: 4.5, f: 2.5, step: 25, dq: 125, est: false },
  { id: 'creatine', name: 'ครีเอทีน (จดเฉยๆ)', unit: 'ก.', base: 5, k: 0, p: 0, c: 0, f: 0, step: 5, dq: 5, est: false },
  { id: 'oil', name: 'น้ำมันรำข้าว', unit: 'ช้อนโต๊ะ', base: 1, k: 124, p: 0, c: 0, f: 14, step: 1, dq: 1, est: true },
  { id: 'apple', name: 'แอปเปิ้ล Envy', unit: 'ลูก', base: 1, k: 90, p: 0.5, c: 22, f: 0.3, step: 1, dq: 1, est: true },
  { id: 'applesm', name: 'แอปเปิ้ล Envy ลูกเล็ก (~150 ก.)', unit: 'ลูก', base: 1, k: 80, p: 0.4, c: 20.5, f: 0.2, step: 1, dq: 1, est: true },
  { id: 'jam', name: 'แยมสตรอเบอร์รี่ เบสท์ฟู้ดส์', unit: 'ช้อนโต๊ะ', base: 1, k: 30, p: 0, c: 8, f: 0, step: 1, dq: 1, est: false },
  { id: 'bread', name: 'ขนมปังโฮลวีตฟาร์มเฮ้าส์', unit: 'แผ่น', base: 1, k: 70, p: 2.5, c: 12, f: 1.25, step: 1, dq: 2, est: false }
];
const defSettings = () => ({
  targets: { rest: { k: 2040, p: 220, c: 173, f: 46 }, train: { k: 2340, p: 220, c: 230, f: 50 } },
  rice: { rest: 160, train: 180 },
  trainDays: [2, 4, 6, 0],
  meals: [
    { id: 'b', name: 'มื้อเช้า', items: [{ food: 'chicken', qty: 200 }, { food: 'rice', rice: true }] },
    { id: 'd', name: 'มื้อเย็น', items: [{ food: 'shrimp', qty: 150 }, { food: 'rice', rice: true }, { food: 'duckegg', qty: 1 }, { food: 'egg', qty: 1 }, { food: 'oil', qty: 1 }] },
    { id: 'l', name: 'มื้อสุดท้าย', items: [{ food: 'chicken', qty: 200 }, { food: 'rice', rice: true }] },
    { id: 's', name: 'ปั่นหลังฝึก', items: [{ food: 'whey', qty: 4 }, { food: 'creatine', qty: 5 }, { food: 'meijiup', qty: 125 }, { food: 'oats', qty: 60, trainOnly: true }] }
  ],
  foods: JSON.parse(JSON.stringify(DEF_FOODS)),
  supps: [['s1', 'Omega-3', '3 เม็ด'], ['s3', 'Vitamin D3 + K2', ''], ['s4', 'Magnesium glycinate', ''], ['s5', 'Astaxanthin', '6 mg'], ['s6', 'CoQ10', '100 mg'], ['s7', 'Citrus bergamot', '1,200 mg'], ['s8', 'Hyaluronic acid + MSM', ''], ['s9', 'Zinc', '15 mg พร้อมมื้ออาหาร']],
  cardio: [['walk', 'เดินชันบนลู่ 35 นาที (หลังเวท)'], ['bike', 'ปั่นจักรยาน 30 นาที (วันพัก)']]
});
const EXC = {
  'อก': [['Incline bench press', 'เบนช์เพรสเอียง'], ['Incline dumbbell press', 'ดัมเบลเพรสเอียง'], ['Bench press', 'เบนช์เพรส'], ['Chest press machine', 'เครื่องดันอก'], ['Cable fly', 'เคเบิลฟลาย'], ['Pec deck', 'เครื่องบีบอก'], ['Dips', 'ดิป']],
  'หลัง': [['Barbell row', 'บาร์เบลโรว์'], ['Lat pulldown', 'ดึงบาร์หน้า'], ['Seated row', 'โรว์เคเบิลนั่ง'], ['Seated row wide grip', 'โรว์นั่งจับกว้าง'], ['Face pull', 'เฟซพูล'], ['Back extension', 'แบ็คเอ็กซ์เทนชัน'], ['One-arm dumbbell row', 'ดัมเบลโรว์ข้างเดียว'], ['T-bar row', 'ทีบาร์โรว์'], ['Chest-supported row', 'โรว์พิงอก'], ['Pull-up', 'ดึงข้อ'], ['Straight-arm pulldown', 'เคเบิลแขนตรง'], ['Deadlift', 'เดดลิฟต์']],
  'ไหล่': [['Shoulder press', 'ดันไหล่'], ['Lateral raise', 'ยกไหล่ข้าง'], ['Rear delt fly', 'ไหล่หลัง'], ['Reverse fly', 'เรวอร์สฟลาย'], ['Front raise', 'ยกไหล่หน้า']],
  'ขา': [['Squat', 'สควอท'], ['Leg press', 'เลกเพรส'], ['Romanian deadlift', 'โรมาเนียนเดดลิฟต์'], ['Leg curl', 'เลกเคิร์ล'], ['Leg extension', 'เลกเอ็กซ์เทนชัน'], ['Calf raise', 'ยกส้นเท้า']],
  'แขน': [['Bicep curl', 'เคิร์ลหน้าแขน'], ['Hammer curl', 'แฮมเมอร์เคิร์ล'], ['Triceps pushdown', 'กดเคเบิลหลังแขน'], ['Overhead triceps extension', 'หลังแขนเหนือหัว'], ['Skull crusher', 'สกัลครัชเชอร์']]
};
const CATS = Object.keys(EXC);
const catOf = ex => CATS.find(c => EXC[c].some(x => x[0] === ex)) || null;

/* ================= state + offline queue ================= */
const S = { settings: defSettings(), days: {}, photos: {}, date: todayStr(), tab: 'today', undo: [], fill: false, pd: null, wk: todayStr(), cat: lsGet('fit-cat') || 'อก', pcache: {}, loaded: false };
let TOKEN = lsGet('fit-token') || '';
const Q = new Map();                       // key -> {key,action,args,ts}; mirrored to IndexedDB so a closed tab loses nothing
let flushing = false, lastErr = '', lastOk = 0, timer = null, idbp = null;

function idb() {
  if (idbp) return idbp;
  idbp = new Promise((res, rej) => {
    try { const r = indexedDB.open('fit', 1); r.onupgradeneeded = () => r.result.createObjectStore('q', { keyPath: 'key' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch (e) { rej(e); }
  });
  return idbp;
}
async function qPut(op) { Q.set(op.key, op); try { (await idb()).transaction('q', 'readwrite').objectStore('q').put(op); } catch (e) { /* หน่วยความจำอย่างเดียว */ } }
async function qDel(key) { Q.delete(key); try { (await idb()).transaction('q', 'readwrite').objectStore('q').delete(key); } catch (e) { /* ข้าม */ } }
async function qLoad() {
  try {
    const all = await new Promise((res, rej) => { idb().then(db => { const r = db.transaction('q').objectStore('q').getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }, rej); });
    all.forEach(op => { Q.set(op.key, op); if (op.action === 'saveDay') S.days[op.args.date] = op.args.data; if (op.action === 'saveSettings') S.settings = op.args.settings; });
  } catch (e) { /* ไม่มี IndexedDB */ }
}
const API_URL = 'https://script.google.com/macros/s/AKfycbzwjaPO4zYob_esG7dc2WkelRKLx_ey8a3EyOEgKr1ESLavaMAh330keIYMWY7FWBcKTg/exec';
// หน้านี้ถูกเสิร์ฟจากที่อื่น (GitHub Pages) แล้วคุยกับตู้กลาง Apps Script ด้วย POST text/plain (ไม่มี preflight)
function call(action, payload) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 60000);
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: TOKEN, action, payload }), signal: ctl.signal })
    .then(r => r.json())
    .then(r => (r && r.ok) ? r : Promise.reject(new Error((r && r.error) || 'ตอบกลับผิดปกติ')))
    .catch(e => { throw (e && e.name === 'TypeError' || e && e.name === 'AbortError') ? new Error('เชื่อมตู้กลางไม่ได้ (ไม่มีเน็ตหรือช้าเกินไป)') : (e instanceof Error ? e : new Error(String(e))); })
    .finally(() => clearTimeout(to));
}
async function flush() {
  if (flushing) return;
  flushing = true; bar();
  try {
    while (Q.size) {
      const op = [...Q.values()].sort((a, b) => a.ts - b.ts)[0];
      await call(op.action, op.args);
      const cur = Q.get(op.key);
      if (cur && cur.ts === op.ts) await qDel(op.key);     // keep it if edited again while sending
      lastOk = Date.now(); lastErr = '';
    }
  } catch (e) {
    lastErr = e.message;
    if (/รหัสลับ/.test(lastErr)) { TOKEN = ''; lsSet('fit-token', ''); render(); }
    clearTimeout(timer); timer = setTimeout(flush, 20000);
  }
  flushing = false; bar();
}
function enqueue(key, action, args) { return qPut({ key, action, args, ts: Date.now() }).then(() => { bar(); clearTimeout(S._deb); S._deb = setTimeout(flush, 800); }); }
function bar() {
  const b = document.getElementById('bar'); b.replaceChildren();
  let cls = 'idle', msg;
  if (!TOKEN) { if (lastErr) { cls = 'bad'; msg = '⚠ ' + lastErr + ' · ลองใส่รหัสลับใหม่'; } else msg = 'ใส่รหัสลับเพื่อเริ่มใช้งาน'; }
  else if (Q.size && lastErr) { cls = 'bad'; msg = '⚠ ยังไม่ถึง Drive (' + Q.size + ' รายการรอส่ง) · ' + lastErr + ' · เก็บไว้ในเครื่องแล้ว จะส่งซ้ำเอง'; }
  else if (Q.size || flushing) { cls = 'warn'; msg = 'กำลังส่งขึ้น Drive… (' + Q.size + ' รายการ)'; }
  else if (lastOk) { cls = 'ok'; const d = new Date(lastOk + TZ); msg = '✓ ส่งถึง Drive แล้ว ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); }
  else if (lastErr) { cls = 'bad'; msg = '⚠ ' + lastErr; }
  else msg = S.loaded ? 'โหลดข้อมูลจาก Drive แล้ว ยังไม่มีอะไรรอส่ง' : 'กำลังโหลด…';
  b.className = cls; b.append(msg);
  if (Q.size && !flushing) b.append(el('button', { onclick: flush }, 'ส่งตอนนี้'));
}

/* ================= data helpers ================= */
const SETTINGS_VER = 3;   // bump when default meals/foods change; migrate() adds the new ones without touching the owner's edits elsewhere
function migrate() {
  const st = S.settings, d = defSettings();
  if ((st.sv || 0) >= SETTINGS_VER) return;
  d.meals.forEach(m => { const i = st.meals.findIndex(x => x.id === m.id); if (i < 0) st.meals.push(m); else if (m.id === 's') st.meals[i] = m; });
  d.foods.forEach(f => { if (!st.foods.some(x => x.id === f.id)) st.foods.push(f); });
  st.sv = SETTINGS_VER;
}
const foodById = id => S.settings.foods.find(f => f.id === id);
const newDay = date => ({ date, type: S.settings.trainDays.includes(dow(date)) ? 'train' : 'rest', foods: [], meals: {}, supps: {}, cardio: {}, sets: [], weight: '', waist: '', updated: '' });

    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('อ่านรูปไม่ได้')); };
    img.src = url;
  });
}

/* ================= import from the old artifact app (copy-all JSON) ================= */
function importOld(txt) {
  let inc; try { inc = JSON.parse(txt.trim()); } catch (e) { return 'ข้อมูลที่วางไม่ถูกต้อง ลองคัดลอกมาใหม่'; }
  let n = 0;
  Object.keys(inc).forEach(k => {
    const a = inc[k]; if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !a || !Array.isArray(a.sets) || !a.sets.length) return;
    const d = day(k);
    if (a.sets.length > d.sets.length) d.sets = a.sets.map(x => ({ ex: x.ex, cat: x.cat || catOf(x.ex) || 'อื่นๆ', kg: Number(x.kg), reps: Number(x.reps), rpe: Number(x.rpe), t: x.t || '' }));
    ['weight', 'waist'].forEach(f => { if ((d[f] === '' || d[f] == null) && a[f] !== '' && a[f] != null) d[f] = a[f]; });
    if (d.type !== 'train') { d.type = 'train'; d.foods.forEach(e => { if (e.rice && e.meal) e.qty = S.settings.rice.train; }); }
    touch(d); n++;
  });
  return n ? 'นำเข้า ' + n + ' วันแล้ว กำลังส่งขึ้น Drive ดูแถบด้านบน' : 'ไม่พบเซ็ตฝึกในข้อมูลที่วาง';
}

async function refresh() {

    migrate();

async function boot() {
